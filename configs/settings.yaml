stream:
  buffer_fps: 16
  analysis_fps: 8
  buffer_seconds: 30
  pre_roll_seconds: 4.0
  post_roll_seconds: 11.0
  jpeg_quality: 85

perception:
  model_weights: "weights/yolov8n.pt"
  tracker_config: "bytetrack.yaml"
  confidence_threshold: 0.45
  person_class_id: 0

action:
  enabled: true
  weights_path: "weights/fight_r3d18.pth"
  clip_len: 16
  eval_stride: 4
  confidence_threshold: 0.78

vlm:
  enabled: true
  model_id: "vikhyatk/moondream2"
  cache_dir: "weights/hf_cache"

events:
  cooldown_seconds: 15.0
  output_dir: "data/outputs"